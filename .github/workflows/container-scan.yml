name: Trivy Security Scan

on:
  workflow_run:
    workflows: ["Build and upload GHCR container"]
    types: [completed]

  schedule:
    - cron: '17 4 * * *'

  workflow_dispatch:


jobs:
  trivy-scan:
    name: Upload Container
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2.5.0

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set target image name
        id: target
        run: |
          # On schedule, scan the latest production image in your registry
          echo "CONTAINER_NAME=ghcr.io/${{ env.REPO_LC }}/app:latest" >> $GITHUB_ENV

      - name: 'Build Image'
        run: |
          docker buildx build --output type=docker --tag "${CONTAINER_NAME}" .

      - name: Run Trivy image scan (SARIF for Security Tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.CONTAINER_NAME }}'
          trivy-config: .trivy.yaml
          ignorefile: .trivyignore.yaml
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0' # Let the SARIF upload step run before failing the job

      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Enforce build failure on Critical/High CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.CONTAINER_NAME }}'
          trivy-config: .trivy.yaml
          ignorefile: .trivyignore.yaml
          format: 'table'
